<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение: Босс-молокосос</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="invitation-container">
        <!-- Фоновый узор (горошек сверху) -->
        <div class="bg-pattern-top"></div>

        <!-- Верхний персонаж: летящий босс -->
        <div class="character flying-boss">
            <!-- ЗАМЕНИТЕ src НА ПУТЬ К ВАШЕМУ ФАЙЛУ -->
            <img src="images/flying_boss.png" alt="Босс летит сверху" class="char-img">
        </div>

        <!-- Левый нижний персонаж: босс в очках -->
        <div class="character glasses-boss">
            <!-- ЗАМЕНИТЕ src НА ПУТЬ К ВАШЕМУ ФАЙЛУ -->
            <img src="images/boss_glasses.png" alt="Босс в очках" class="char-img">
        </div>

        <!-- Правый нижний персонаж: босс на троне -->
        <div class="character throne-boss">
            <!-- ЗАМЕНИТЕ src НА ПУТЬ К ВАШЕМУ ФАЙЛУ -->
            <img src="images/boss_throne.png" alt="Босс на троне" class="char-img">
        </div>

        <!-- Логотип BABY BOSS -->
        <div class="logo-area">
            <!-- Если есть картинка логотипа с прозрачным фоном, используйте img. 
                 Если нет, текст ниже стилизуется под логотип. -->
            <span class="logo-text">BABY BOSS</span>
        </div>

        <!-- Декоративные элементы (галстуки, портфели) -->
        <div class="decor tie-top"></div>
        <div class="decor briefcase-left"></div>
        <div class="decor tie-right"></div>

        <!-- Группы шаров (имитация объема) -->
        <div class="balloons-group left-balloons"></div>
        <div class="balloons-group right-balloons"></div>

        <!-- Центральная область для текста приглашения -->
        <main class="content-wrapper">
            <h1 class="invite-title">Ты приглашен!</h1>
            <p class="invite-text">
                На грандиозную вечеринку в стиле «Босс-молокосос»!<br>
                Готов показать, кто тут главный?
            </p>
            <div class="event-details">
                <p><strong>Дата:</strong> 25 Октября 2024</p>
                <p><strong>Время:</strong> 16:00</p>
                <p><strong>Место:</strong> ул. Праздничная, д. 10</p>
            </div>
            <button class="rsvp-btn">Подтвердить присутствие</button>
        </main>
    </div>
</body>
</html>
